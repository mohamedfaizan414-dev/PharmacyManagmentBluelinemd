server {
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Same-origin S3 proxy for PDF/canvas logo (avoids CORS on deployed builds)
    location /s3-dev/ {                                                             
        proxy_pass https://bluelinemd-files-dev.s3.eu-north-1.amazonaws.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host bluelinemd-files-dev.s3.eu-north-1.amazonaws.com;
    }
}